<!DOCTYPE html>
<html>
    <head>
        <title>
            Json
        </title>
    </head>

    <body>
        <script>
            var student = {
                name: "Alex",
                grade: "9",
                age: 15,
                rank: 3
            }
            var convert = JSON.stringify(student)
            console.log(convert)

            var revert = JSON.parse(convert)
            console.log(revert)
        </script>
    </body>
</html>
